<text x="56.0" y="197.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Merge sort both halves first: left [1,2,3], right [1,3] (the right half contributed</text>
<text x="56.0" y="216.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">1 pair internally: 3 &gt; 2·1). Now a sweep: left 3 &gt; 2·1 — one cross pair. The</text>
<text x="56.0" y="235.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">condition (&gt;2x) differs from the merge condition (&gt;), so it needs its own pass.</text>
