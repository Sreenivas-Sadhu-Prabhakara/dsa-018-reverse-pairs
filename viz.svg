<text x="56.0" y="394.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Inside-left 0 + inside-right 1 + cross 1 = 2 pairs, found in O(n log n). The</text>
<text x="56.0" y="413.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">counting pointer never moves backwards — the halves are sorted.</text>
